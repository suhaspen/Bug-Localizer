[project]
name = "bug-localizer"
version = "0.1.0"
description = "Retrieve and rank the source files most likely responsible for a bug, evaluated on a dataset self-labeled from git history."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "pydantic>=2.7",
    "pyyaml>=6.0",
    "rich>=13.7",
    "gitpython>=3.1.43",
    "rank-bm25>=0.2.2",
]

# Heavy ML dependencies live in an extra so `make test` stays fast and green
# from commit 1. Installed at Milestone 2, when we actually need embeddings.
[project.optional-dependencies]
ml = [
    "sentence-transformers>=3.0",
    "psycopg[binary]>=3.1",
    "pgvector>=0.2.5",
]

[project.scripts]
bugloc = "buglocalizer.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "ruff>=0.5",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/buglocalizer"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
